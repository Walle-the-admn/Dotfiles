# $HOME/.config/alacritty/alacritty.toml
# Written by Walle-the-admn 2026-28-2

# See alactritty config options: https://alacritty.org/config-alacritty.html
# See TOML syntax guide: https://toml.io/en/v1.0.0
# JetBrains Mono font download: https://www.jetbrains.com/lp/mono/

[general]

live_config_reload = true

[window]

opacity = 0.9

padding.x = 10
padding.y = 10

decorations = "Full"
decorations_theme_variant = "Dark"

[font]

normal.family = "JetBrains Mono"
bold.family = "JetBrainsMono"
italic.family = "JetBrainsMono"
bold_italic.family = "JetBrains Mono"

size = 12.0

[colors]
